[package]
name = "web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SSR dashboard (D01-D07). JWT stays server-side; browser fetches /api/v1/* for data."

[lib]
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
domain = { path = "../domain" }
store = { path = "../store" }
api = { path = "../api" }
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower-http = { version = "0.5", features = ["trace"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
jsonwebtoken = "9"
bcrypt = "0.15"
time = "0.3"
uuid.workspace = true
chrono.workspace = true
sqlx.workspace = true
