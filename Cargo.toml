[workspace]
members = ["domain", "store", "agent", "messaging", "api", "web", "server"]
resolver = "2"

[workspace.dependencies]
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
axum = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Biz-Brain Team"]
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
